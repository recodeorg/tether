name: Test Suite

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write      # Required to post annotations and check runs
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Tests
        # Run gotestsum with JUnit output; --raw-command passes standard go test flags
        run: |
          mkdir -p test-results
          gotestsum --junitfile test-results/unit-tests.xml -- -race -v ./...

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # Ensures report runs even if tests fail
        with:
          report_paths: 'test-results/unit-tests.xml'
          annotate_only: false
          detailed_summary: true